services:
  - type: web
    name: anger-gauge
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: DISCORD_PUBLIC_KEY
        sync: false
      - key: DISCORD_OWNER_ID
        sync: false
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
